<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // the dex lives in a GitHub Pages folder: links and routes hang off DEXROOT
      var DEXROOT = location.pathname.indexOf('/unbound-dex/') === 0 ? '/unbound-dex/' : '/';
      document.write('<base href="' + DEXROOT + '">');
      (function () {  // deep links arrive through 404.html as ?p=<path>
        var m = location.search.match(/[?&]p=([^&]*)/);
        if (m) history.replaceState(null, '', DEXROOT + decodeURIComponent(m[1]));
      })();
    </script>

    <title>Unbound Dex</title>

    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=IE8" />
	<script>
		(function () {
			var theme = 'dark';  // dark until the visitor picks Light
			try {
				var savedTheme = localStorage.getItem('nulldex-theme');
				if (savedTheme === 'dark' || savedTheme === 'light') theme = savedTheme;
			} catch (e) {}
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
    <link
      rel="stylesheet"
      href="https://play.pokemonshowdown.com/style/font-awesome.css"
    />
    <link rel="stylesheet" href="theme/panels.css?v=20261029133711" />
